[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musclememory"
version = "0.1.0"
description = "Open-source procedural memory for AI agents: learns from what worked and what failed."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "TheWariend"}]
keywords = ["musclememory", "agent-memory", "procedural-memory", "ai-agents", "coding-agents", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0", "fastapi>=0.143,<1", "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "uvicorn>=0.34,<1",
  "tiktoken>=0.9,<1", "fastembed>=0.7,<1", "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://thewariend.com/musclememory"
Repository = "https://github.com/TheWariend/MuscleMemory"
Documentation = "https://github.com/TheWariend/MuscleMemory/tree/main/docs"
Issues = "https://github.com/TheWariend/MuscleMemory/issues"

[project.scripts]
musclememory = "musclememory.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["musclememory*"]

[tool.setuptools.package-data]
musclememory = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires MM_TEST_POSTGRES_URL pointing at an isolated test database",
  "typescript: requires Node and the built TypeScript SDK",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

