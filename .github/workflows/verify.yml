name: Verify MuscleMemory

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MM_DATABASE_URL: sqlite://
  MM_TEST_CODEX: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps --no-build-isolation -e .
      - name: Check Python style
        run: |
          ruff check packages tests scripts examples benchmarks
          ruff format --check packages tests scripts examples benchmarks
      - name: Check generated API and SDK contracts
        run: |
          python scripts/generate_contracts.py
          git diff --exit-code -- docs/openapi.json packages/sdk-typescript/src/contracts.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: memory_test
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U memory -d memory_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Build the TypeScript SDK for interoperability checks
        run: npm ci && npm run build --workspace @thewariend/musclememory
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps --no-build-isolation -e .
      - name: Run Python, protocol, and PostgreSQL checks
        run: pytest -q --junitxml=reports/pytest.xml
        env:
          MM_TEST_POSTGRES_URL: postgresql+psycopg://memory:test-only-password@127.0.0.1:5432/memory_test
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-report
          path: reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build the dashboard and SDK
        run: npm run build
      - name: Run TypeScript SDK checks
        run: npm run test:sdk

