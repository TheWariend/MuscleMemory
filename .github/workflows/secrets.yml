name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commit history for credentials
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: |
          log_options=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_options=("--log-opts=${PR_BASE_SHA}..${PR_HEAD_SHA}")
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            log_options=("--log-opts=${PUSH_BEFORE_SHA}..${GITHUB_SHA}")
          fi
          # Keep repository-controlled config and ignore files out of the scan root.
          # A bare clone preserves commit history without checking out those files.
          scan_repo="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf -- "$scan_repo"' EXIT
          git clone --bare --no-hardlinks "$GITHUB_WORKSPACE" "$scan_repo"
          docker run --rm --network none \
            --env GITLEAKS_CONFIG_TOML \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "$scan_repo:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --ignore-gitleaks-allow "${log_options[@]}"
